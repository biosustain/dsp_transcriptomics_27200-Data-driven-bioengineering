name: Publish dev container image

on:
  release:
    types: [published]
  # Lets the image be (re)built on demand from the Actions tab, without
  # having to cut a release.
  workflow_dispatch:
  # Keeps the published image in step with the container definition.
  push:
    branches: [main]
    paths:
      # Only what actually goes into the image — editing devcontainer.json
      # does not change the image, so it should not trigger a rebuild.
      - ".devcontainer/Dockerfile"
      - ".devcontainer/install_packages.R"
      - ".github/workflows/publish-devcontainer.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          # Codespaces runs on amd64; building only this keeps publishes fast.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # install.packages() only warns when a package fails to build, so the
      # image can publish "successfully" with a broken package inside. Check
      # the real thing before anyone opens a Codespace on it.
      - name: Verify the published image
        run: |
          set -euo pipefail
          IMAGE="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')@${{ steps.build.outputs.digest }}"
          echo "Verifying $IMAGE"

          docker run --rm -v "$PWD/.devcontainer:/verify:ro" "$IMAGE" \
            Rscript /verify/verify_image.R

          docker run --rm "$IMAGE" bash -lc '
            set -e
            command -v nextflow >/dev/null || { echo "MISSING: nextflow"; exit 1; }
            nextflow -version >/dev/null 2>&1 || { echo "BROKEN: nextflow"; exit 1; }
            python3 -c "import pandas, numpy, matplotlib, seaborn, scipy, statsmodels, sklearn"
            jupyter kernelspec list | grep -qw ir || { echo "MISSING: R kernel"; exit 1; }
            jupyter kernelspec list | grep -qw python3 || { echo "MISSING: Python kernel"; exit 1; }
            claude --version >/dev/null 2>&1 || { echo "BROKEN: claude"; exit 1; }
            codex --version >/dev/null 2>&1 || { echo "BROKEN: codex"; exit 1; }
            echo "nextflow, Python stack, both Jupyter kernels and AI agent CLIs OK"
          '
